# Packages installed by run_onchange_before_install-packages.sh.tmpl.
# Editing this list makes the next `chezmoi apply` install whatever is missing.
# CPU microcode (intel-ucode / amd-ucode) is picked automatically.
packages:
  # Every machine
  common:
    # system
    - base
    - base-devel
    - dosfstools
    - linux
    - linux-firmware
    - sudo
    - pacman-contrib
    - reflector
    - man-db
    - inetutils
    - openssh
    - iwd
    - impala
    - bluez
    - bluez-utils
    - bluetui
    - power-profiles-daemon
    - udiskie
    - seahorse
    - keyd
    - gnome-keyring
    # desktop
    - sway
    - swaybg
    - swayidle
    - swaylock
    - fuzzel
    - mako
    - foot
    - xdg-desktop-portal-wlr
    - xdg-utils
    - wl-clipboard
    - grim
    - slurp
    - swappy
    - wob
    - wlsunset
    - cliphist
    - i3status-rust
    # audio
    - pipewire
    - pipewire-pulse
    - wireplumber
    - playerctl
    - pipewire-alsa
    - pipewire-jack
    - rtkit
    - alsa-utils
    # fonts
    - noto-fonts
    - noto-fonts-emoji
    - noto-fonts-cjk
    - terminus-font
    - ttf-jetbrains-mono-nerd
    # tools
    - chezmoi
    - git
    - github-cli
    - neovim
    - vim
    - tmux
    - bash-completion
    - fzf
    - ripgrep
    - fd
    - btop
    - opencode
    - unzip
    - tree
    - jq
    # python: projects and versions (uv), lint/format (ruff), types (pyright)
    - uv
    - ruff
    - pyright
    # apps
    - firefox
    - signal-desktop
    - imv
    - mpv
    - zathura
    - zathura-pdf-mupdf
  # Only on the machine with this hostname
  laptop:
    - brightnessctl
  workstation: []
  # From the AUR, via yay: every machine, then per hostname
  aur:
    common: []
    workstation:
      - chrysalis-bin
  # Pulled in by other packages; marked as dependencies if installed explicitly
  asdeps:
    - ttf-dejavu
    - mesa
  # Uninstalled (with their unneeded dependencies) wherever they're present
  remove:
    - zoom
    - aws-cli
    - wofi
    - dmidecode
    - yay-debug
