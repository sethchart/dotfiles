#!/bin/bash
# Zoom rewrites this file itself, so only enforce the keys below and keep the rest.
# xwayland=false: run on native Wayland (there's no Xwayland, so the default xcb
#   backend crashes on startup)
# enableWaylandShare=true: screen sharing through xdg-desktop-portal-wlr
set -euo pipefail
awk '
  BEGIN { want["xwayland"] = "false"; want["enableWaylandShare"] = "true" }
  function add_missing() { for (k in want) if (!(k in seen)) { print k "=" want[k]; seen[k] = 1 } }
  /^\[/ { if (section == "[General]") { add_missing(); if (blanks) print "" ; blanks = 0 } section = $0 }
  section == "[General]" && /^$/ { blanks++; next }
  {
    if (section == "[General]") { for (; blanks > 0; blanks--) print "" }
    if ($0 == "[General]") general = 1
    k = substr($0, 1, index($0, "=") - 1)
    if (section == "[General]" && (k in want)) { print k "=" want[k]; seen[k] = 1; next }
    print
  }
  END {
    if (!general) print "[General]"
    add_missing()
    for (; blanks > 0; blanks--) print ""
  }
'
