# vi keys in copy mode
set -g mode-keys vi

# Let tmux use full 24-bit colour in foot
set -as terminal-features ",foot*:RGB"

# Status bar at the top, dark navy with a nebula-orange accent
set -g status-position top
set -g status-style "bg=#1e2030,fg=#a9b1d6"
set -g status-left "#[bg=#e8955a,fg=#1e2030,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#e8955a]%H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#2f334d,fg=#c0caf5,bold] #I:#W "
set -g window-status-separator ""

# Matching pane borders and messages
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#e8955a"
set -g message-style "bg=#2f334d,fg=#c0caf5"

# Session preservation (plugins cloned by chezmoi, see .chezmoiexternal.toml)
# prefix Ctrl+s saves, prefix Ctrl+r restores; continuum saves every 15 minutes
# and restores the last save automatically when tmux starts.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'btop'
set -g @continuum-restore 'on'
run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux
# continuum must load last: it hooks into status-right
run-shell ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux
