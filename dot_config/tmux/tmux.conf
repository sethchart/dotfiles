# vi keys in copy mode
set -g mode-keys vi

# Let tmux use full 24-bit colour in foot
set -as terminal-features ",foot*:RGB"

# Status bar at the top, dark navy with a soft blue accent
set -g status-position top
set -g status-style "bg=#1e2030,fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#1e2030,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#7aa2f7]%H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#2f334d,fg=#c0caf5,bold] #I:#W "
set -g window-status-separator ""

# Matching pane borders and messages
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#2f334d,fg=#c0caf5"
